{% extends "base.html" %}
{% load static %}

{% block title %}My Forms{% endblock %}

{% block extra_head %}
<style>
  h2 {
    text-align: center;
    color: #333;
    margin: 20px 0 20px;
  }

  /* Centralni kontejner za liste formi */
  #formsList {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    width: 80%;
    max-width: 1100px;
    margin: 0 auto 50px;
  }

  /* Svaka forma kao “kartica” */
  .form-card {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    width: 100%;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .form-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
  }

  .locked {
    opacity: 0.85;
  }

  .form-card h3 {
    margin: 0 0 8px 0;
    font-size: 20px;
    color: #333;
  }

  .form-card p {
    color: #555;
    margin-bottom: 15px;
  }

  /* Red sa dugmićima */
  .form-card .buttons-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-start;
    gap: 10px;
  }

  /* Dugmad – iste visine, širina po tekstu */
  .form-card button {
    background-color: #4CAF50;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    color: white;
    font-size: 15px;
    cursor: pointer;
    flex: 1 1 auto;
    min-width: 120px;
    max-width: 180px;
    text-align: center;
    transition: background-color 0.2s, transform 0.1s;
  }

  .form-card button:hover {
    background-color: #6edb6e;
    color: #222;
    transform: scale(1.03);
  }

  .form-card button.delete-btn {
    background-color: #e74c3c;
  }

  .form-card button.delete-btn:hover {
    background-color: #ff6b5c;
  }

  .form-card button.share-btn {
    background-color: #3498db;
  }

  .form-card button.share-btn:hover {
    background-color: #5dade2;
  }
</style>
{% endblock %}

{% block content %}
<h2>📋 My Forms</h2>
<div id="formsList"></div>

{% load static %}
<script src="{% static 'js/view_forms.js' %}"></script>
{% endblock %}
