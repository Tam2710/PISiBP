<!DOCTYPE html>
<html lang="en">
<head>
{% load static %}
<link rel="stylesheet" href="{% static 'css/style.css' %}">
<meta charset="UTF-8">
<title>Google Forms Clone</title>
</head>

<body>
  {% include "top_bar.html" %}

  <div id="content" class="form-container" style="margin-top: 80px;">
    <h3>Welcome to the Forms Platform</h3>
    <p>Use the buttons above to log in, register, or manage your forms.</p>
  </div>
</body>


<script>
function renderWelcome(){
  document.getElementById('content').innerHTML = `
    <div class="form-container">
      <h3>Welcome to the Forms Platform</h3>
      <p>Use the buttons above to log in, register, or manage your forms.</p>
    </div>
  `;
}

document.addEventListener('DOMContentLoaded', () => {
  renderWelcome();
  updateButtons();
});
</script>

</body>
</html>
