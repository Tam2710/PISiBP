<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Forms Platform{% endblock %}</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">

  <!-- Ovde malo “globalnog” stila za sve stranice koje nasleđuju base -->
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, lightgreen, white);
      display: block;
      width: 100%;
      height: auto;
    }

    /* Sve stranice koje koriste base imaju sadržaj ispod top bara */
    main {
      margin-top: 80px;   /* visina top bara */
      padding-bottom: 40px;
    }
  </style>

  {% block extra_head %}{% endblock %}
</head>
<body>
  {% include "top_bar.html" %}

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
