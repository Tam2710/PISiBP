<div id="topbar">
  <div class="topbar-container">
    <div class="logo" onclick="window.location.href='/'"><strong>Forms Platform</strong></div>
    <div class="nav-buttons">
      <button id="btnLogin" onclick="showPopup('login')">Login</button>
      <button id="btnSignup" onclick="showPopup('signup')">Sign Up</button>
      <button id="btnCreate" onclick="createForm()">Create Form</button>
      <button id="btnView" onclick="openViewForms()">View Forms</button>
      <button id="btnLogout" onclick="logout()">Logout</button>
    </div>
  </div>
</div>

<!-- Popup koji se koristi za login/signup -->
<div id="popup" class="popup hidden"></div>

<style>
  #topbar {
    position: fixed;
    height: 7%;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    background: rgba(40, 167, 69, 0.95);
    color: white;
    padding: 14px 40px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.15);
  }

  .logo {
  font-size: 22px;
  font-weight: bold;
  white-space: nowrap;
  cursor: pointer; /* pokazivač ruke */
  user-select: none; /* sprečava označavanje teksta */
}

.logo:hover {
  opacity: 0.8; /* blagi efekat da se zna da je klikabilno */
}


  .topbar-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .logo {
    font-size: 22px;
    font-weight: bold;
    white-space: nowrap;
  }

  /* Dugmići – ista visina, širina po tekstu */
  .nav-buttons {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .nav-buttons button {
    height: 40px;           /* ista visina */
    padding: 0 18px;        /* širina raste sa tekstom */
    border: none;
    border-radius: 6px;
    background-color: #007bff;
    color: white;
    font-size: 15px;
    font-weight: 500;
    white-space: nowrap;    /* da se tekst ne lomi u novi red */
    cursor: pointer;
    transition: background 0.3s, transform 0.2s;
  }

  .nav-buttons button:hover {
    background-color: #0056b3;
    transform: translateY(-1px);
  }

  /* Popup overlay */
  .popup {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4);
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .popup-content {
    background: white;
    border-radius: 10px;
    padding: 25px;
    width: 350px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    text-align: center;
    animation: fadeIn 0.3s ease-in-out;
  }

  .popup-content h3 {
    margin-bottom: 15px;
    color: #28a745;
  }

  .popup-content input {
    width: 90%;
    margin: 10px 0;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
  }

  .popup-content button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border: none;
    border-radius: 6px;
    background: #28a745;
    color: white;
    cursor: pointer;
    transition: background 0.3s;
  }

  .popup-content button:hover {
    background: #1e7e34;
  }

  .hidden { display: none; }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.9); }
    to   { opacity: 1; transform: scale(1); }
  }
</style>

{% load static %}
<script src="{% static 'js/top_bar.js' %}"></script>
