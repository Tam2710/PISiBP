{% extends "base.html" %}
{% load static %}

{% block title %}Form Results{% endblock %}

{% block extra_head %}
<style>
  h2 {
    text-align: center;
    color: #333;
    margin: 30px 0 20px;
  }

  #resultsList {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    width: 80%;
    max-width: 1100px;
    margin: 0 auto 50px;
  }

  .result-card {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    width: 100%;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .result-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
  }

  .question {
    font-weight: bold;
    color: #333;
    margin-bottom: 5px;
  }

  .answer {
    margin-left: 15px;
    color: #444;
    margin-bottom: 10px;
  }

  hr {
    border: none;
    border-top: 1px solid #eee;
    margin: 10px 0;
  }

  #exportBtn {
    display: block;
    width: 80%;
    max-width: 1100px;
    margin: 0 auto 50px;
    background-color: #4CAF50;
    border: none;
    border-radius: 12px;
    padding: 15px 20px;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.3s ease, transform 0.1s ease;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
  }

  #exportBtn:hover {
    background-color: #6edb6e;
    color: #222;
  }
</style>
{% endblock %}

{% block content %}
<h2>📊 Form Results</h2>
<div id="resultsList"></div>
<button id="exportBtn" onclick="exportForm()">⬇️ Export XLSX</button>

{% load static %}
<script src="{% static 'js/results.js' %}"></script>
{% endblock %}
