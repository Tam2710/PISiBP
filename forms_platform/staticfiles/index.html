<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Google Forms Clone</title>
<style>
  body { font-family: Arial; margin: 40px; background-color: #f7f7f7; }
  button { margin: 5px; padding: 8px 14px; cursor: pointer; border: none; border-radius: 6px; background-color: #007bff; color: white; }
  button:hover { background-color: #0056b3; }
  .hidden { display: none; }
  .form-container { margin-top: 20px; }
</style>
</head>
<body>

<h2>Forms Platform</h2>

<div id="authButtons">
  <button onclick="showLogin()">Login</button>
  <button onclick="showRegister()">Sign Up</button>
</div>

<div id="mainButtons" class="hidden">
  <button onclick="createForm()">Create Form</button>
  <button onclick="openViewForms()">View Forms</button>
  <button onclick="logout()">Logout</button>
</div>

<div id="formContainer" class="form-container"></div>

<script>
const API_URL = "http://127.0.0.1:8000/api/";
let token = localStorage.getItem('access');

// ------------------ LOGIN / REGISTER ------------------
function showLogin(){
  document.getElementById('formContainer').innerHTML = `
    <h3>Login</h3>
    <input id="loginEmail" placeholder="Email"><br>
    <input id="loginPass" type="password" placeholder="Password"><br>
    <button onclick="login()">Login</button>
  `;
}

function showRegister(){
  document.getElementById('formContainer').innerHTML = `
    <h3>Sign Up</h3>
    <input id="regEmail" placeholder="Email"><br>
    <input id="regPass" type="password" placeholder="Password"><br>
    <button onclick="register()">Sign Up</button>
  `;
}

async function register(){
  const email = document.getElementById('regEmail').value;
  const password = document.getElementById('regPass').value;
  const res = await fetch('http://127.0.0.1:8000/register/', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({email, password})
  });
  const data = await res.json();
  if(res.ok) alert('✅ Registration successful! Now log in.');
  else alert(data.error || '❌ Error registering.');
}

async function login(){
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPass').value;
  const res = await fetch('http://127.0.0.1:8000/login/', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({email, password})
  });
  const data = await res.json();
  if(res.ok){
    localStorage.setItem('access', data.access);
    localStorage.setItem('refresh', data.refresh);
    localStorage.setItem('user', JSON.stringify(data.user));
    showMainButtons();
  } else alert(data.error || '❌ Login failed');
}

function showMainButtons(){
  document.getElementById('authButtons').classList.add('hidden');
  document.getElementById('mainButtons').classList.remove('hidden');
  document.getElementById('formContainer').innerHTML = '';
}

// ------------------ LOGOUT ------------------
function logout(){
  localStorage.clear();
  document.getElementById('authButtons').classList.remove('hidden');
  document.getElementById('mainButtons').classList.add('hidden');
  document.getElementById('formContainer').innerHTML = '';
}

// ------------------ NAVIGATION ------------------
function createForm() {
  // Očisti formId i sve stare podatke o formi
  localStorage.removeItem('formId');
  localStorage.removeItem('formData');
  window.location.href = '/form_editor/';
}


function openViewForms(){
  // koristi Django rutu /forms/
  window.location.href = '/forms/';
}

// ------------------ AUTO LOGIN ------------------
if(token) showMainButtons();
</script>
</body>
</html>
