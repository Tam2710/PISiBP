<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Form</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .option-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 5px;
      border: 1px solid #ccc;
      padding: 5px 8px;
      border-radius: 5px;
    }

    .option-item input[type="text"] {
      flex: 1 1 50%;
      padding: 5px;
      font-size: 16px;
    }

    .option-image-label {
      cursor: pointer;
      font-size: 18px;
      color: #555;
    }

    .option-image {
      display: none;
    }

    .remove-btn {
      width: 25px;
      height: 25px;
      background-color: white;
      color:black;
      border: none;
      border-radius: 3px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .remove-btn:hover {
      background-color: gray;
    }

    .required-container {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 5px;
    }

    .delete-question {
      margin-top: 10px;
      background-color: #f44336;
      color: white;
      border: none;
      padding: 10px 10px;
      border-radius: 3px;
      cursor: pointer;
    }

    .delete-question:hover {
      background-color: #d32f2f;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Create a Form</h2>
    <form id="create-form">
      <input type="text" id="form-title" placeholder="Form Title" required><br><br>

      <!-- Hidden template -->
      <div class="question-block template" style="display: none;">
        <input type="text" class="question-text" placeholder="Enter a question" required><br>

        <label>Type:
          <select class="question-type">
            <option value="short-answer">Short Answer</option>
            <option value="multiple-choice">Multiple Choice</option>
            <option value="checkbox">Checkbox</option>
          </select>
        </label><br><br>

        <div class="options-container" style="display: none;"></div>
        <button type="button" class="add-option" style="display:none;">Add Option</button>

        <div class="required-container">
          <label>Required:</label>
          <input type="checkbox" class="question-required">
        </div>
      </div>

      <!-- Initial visible question -->
      <div class="question-block">
        <input type="text" class="question-text" placeholder="Enter a question" required><br>

        <label>Type:
          <select class="question-type">
            <option value="short-answer">Short Answer</option>
            <option value="multiple-choice">Multiple Choice</option>
            <option value="checkbox">Checkbox</option>
          </select>
        </label><br><br>

        <div class="options-container" style="display: none;"></div>
        <button type="button" class="add-option" style="display:none;">Add Option</button>

        <div class="required-container">
          <label>Required:</label>
          <input type="checkbox" class="question-required">
        </div>
      </div>

      <button type="button" id="add-question">Add Another Question</button><br><br>
      <button type="submit">Save Form</button>
    </form>

    <div id="form-questions">
      <h3>Preview Questions</h3>
      <ul id="questions-list"></ul>
    </div>
  </div>

  <script src="../js/form_creation.js"></script>
</body>
</html>
